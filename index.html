<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bei Kiganji</title>
    <!-- Links the PWA manifest so the phone can install the app-->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>
            Bei Kiganji
            <button onclick="openSettings()"
             style="float:right;background:none; border:none;color:#fff;font-size:20px;cursor:pointer"
             aria-label="Settings">⚙️</button>
        </h1>
        <input id="searchInput" type="Search"
        placeholder="Search for products..."
        autocomplete="off"
        oninput="onSearch(this.value)">
    </header>

    <div id="syncBar"> Loading...</div>

    <div id="results">
        <div class="empty">Type a product name to search.</div>
    </div>
    <!-- Admin panel- only shown when admin key is saved-->
    <div id="adminPanel" style="display:none;padding:16px;max-width:480px;margin:0 auto">

        <h3 style="margin-bottom:12px">Admin Tools</h3>

        <!-- CSV UPLOAD-->
        <div class="card" style="flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:12px">
            <strong>Upload price list(csv)</strong>
            <input id="csvFile" type="file" accept=".csv">
            <button class="btn btn-primary" onclick="uploadCSV()">Upload</button>
            <div id="csvStatus" style="font-size:13px;color:#6B7280"></div>
        </div>

        <!-- Share Links-->
        <div class="card" style="flex-direction:column;align-items:flex-start;gap:8px">
            <strong>Create a share Link</strong>
            <input id="shareLabel" type="text" placeholder="Label e.g Isaaq's Phone"
                style="width:100%;padding:8px;border:1px solid #E2E6ED;border-radius:6px;font-size:14px">
            <button class="btn btn-primary" onclick="createShareLink()">Generate link</button>
            <div id="shareresult" style="font-size:13px;word-break:break-all"></div>
        </div> 

        <!-- Existing share links -->
        <div id="shareList" style="margin-top:12px"></div>
    </div>

    
    <div id="settings" onclick="closeSettings(event)">
        <div id="settings-box">
            <h2>⚙️ Settings</h2>

            <label>Backend URL (your Render Link)</label>
            <input id="cfgUrl" type="url" placeholder="https://your-app.onrender.com">

            <label>Share token (leave empty if you are the admin)</label>
            <input id="cfgToken" type="text" placeholder="staff share token">

            <label> Admin key (owner only - keep secret!)</label>
            <input id="cfgAdmin" type="password" placeholder="your ADMIN_KEY">

            <div style="display:flex;gap:10px;margin-top:4px">
                <button class="btn btn-primary" onclick="saveSettings()">Save & sync</button>
                <button class="btn btn-ghost" onclick="closeSettings()">Cancel</button>
            </div>
        </div>
    </div>
 <script src="app.js"></script>   
</body>
</html>
